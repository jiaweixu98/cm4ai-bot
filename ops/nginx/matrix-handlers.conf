# Include inside the bridge2ai.labs-app.com TLS server block.
    # MATRIX browser requests retain the public mount; these handlers belong to Next.
    location ~ ^/matrix/api/(chat-lite|search-people|why-lines|attachment-text|report-error)$ {
        rewrite ^/matrix/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

